<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MCBE JSON UI Inspector</title><link rel="stylesheet" href="app.css"></head><body><header><div><b>MCBE JSON UI Inspector</b><small>final-RP local static evidence</small></div><span id="status">연결 확인 중</span></header><main><aside><label>RP 루트<input id="rpRoot"></label><label>Control<input id="control"></label><label>Route title<input id="title"></label><label>Form fixture JSON<input id="fixturePath"></label><button id="loadFixture">fixture 불러오기</button><div class="row"><label>Viewport<input id="viewport" value="480x270"></label><label>버튼 index<input id="index" type="number" value="0"></label></div><div class="buttons"><button data-action="openProject">인덱싱</button><button data-action="resolveScreen">해석</button><button data-action="renderScreen">렌더</button><button data-action="validateLayout">검사</button></div><h2>로컬 증거</h2><label>참고 이미지<input id="referencePath"></label><button data-import="reference">참고 가져오기</button><label>Bedrock 캡처<input id="screenshotPath"></label><button data-import="screenshot">캡처 가져오기</button><h2>JSON pointer ↔ Control tree</h2><input id="pointer"><div class="nudge"><button data-nudge="x:-1">x−</button><button data-nudge="x:1">x+</button><button data-nudge="y:-1">y−</button><button data-nudge="y:1">y+</button><button data-nudge="w:-1">w−</button><button data-nudge="w:1">w+</button><button data-nudge="h:-1">h−</button><button data-nudge="h:1">h+</button></div><h2>Control tree</h2><input id="filter"><div id="tree"></div></aside><section><nav><button class="state active" data-state="default">default</button><button class="state" data-state="hover">hover</button><button class="state" data-state="pressed">pressed</button><label><input id="overlay" type="checkbox"> rect / hitbox</label></nav><nav id="evidenceTabs"><button class="evidence-tab active" data-evidence="route">Route</button><button class="evidence-tab" data-evidence="binding">Binding</button><button class="evidence-tab" data-evidence="state">State</button><button class="evidence-tab" data-evidence="hit">Hit</button><button class="evidence-tab" data-evidence="source">Source</button></nav><div class="opacity"><label>Render <input id="renderOpacity" type="range" min="0" max="1" step=".05" value="1"></label><label>Reference <input id="referenceOpacity" type="range" min="0" max="1" step=".05" value="0"></label><label>Bedrock <input id="screenshotOpacity" type="range" min="0" max="1" step=".05" value="0"></label></div><div id="stage"><p>RP 루트와 control 또는 route title을 입력하세요.</p><img id="renderLayer" class="layer"><img id="referenceLayer" class="layer"><img id="screenshotLayer" class="layer"></div><div class="metrics"><pre id="evidencePanel">Route 증거가 표시됩니다.</pre><pre id="issues">검사 결과가 표시됩니다.</pre></div></section></main><script type="module" src="app.js"></script></body></html>
