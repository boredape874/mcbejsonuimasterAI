constraints:
  - op: same_size
    ids:
      - cell_0_0
      - cell_0_1
      - cell_0_2
      - cell_1_0
      - cell_1_1
      - cell_1_2
      - cell_2_0
      - cell_2_1
      - cell_2_2
      - cell_3_0
      - cell_3_1
      - cell_3_2
      - cell_4_0
      - cell_4_1
      - cell_4_2
  - op: same_size
    ids:
      - symbol_0_0
      - symbol_0_1
      - symbol_0_2
      - symbol_1_0
      - symbol_1_1
      - symbol_1_2
      - symbol_2_0
      - symbol_2_1
      - symbol_2_2
      - symbol_3_0
      - symbol_3_1
      - symbol_3_2
      - symbol_4_0
      - symbol_4_1
      - symbol_4_2
  - op: equal_gap_x
    ids: &a1
      - cell_0_0
      - cell_1_0
      - cell_2_0
      - cell_3_0
      - cell_4_0
    gap: 8
  - op: align_y
    ids: *a1
    edge: center
  - op: equal_gap_x
    ids: &a2
      - cell_0_1
      - cell_1_1
      - cell_2_1
      - cell_3_1
      - cell_4_1
    gap: 8
  - op: align_y
    ids: *a2
    edge: center
  - op: equal_gap_x
    ids: &a3
      - cell_0_2
      - cell_1_2
      - cell_2_2
      - cell_3_2
      - cell_4_2
    gap: 8
  - op: align_y
    ids: *a3
    edge: center
  - op: equal_gap_y
    ids: &a4
      - cell_0_0
      - cell_0_1
      - cell_0_2
    gap: 8
  - op: align_x
    ids: *a4
    edge: center
  - op: equal_gap_y
    ids: &a5
      - cell_1_0
      - cell_1_1
      - cell_1_2
    gap: 8
  - op: align_x
    ids: *a5
    edge: center
  - op: equal_gap_y
    ids: &a6
      - cell_2_0
      - cell_2_1
      - cell_2_2
    gap: 8
  - op: align_x
    ids: *a6
    edge: center
  - op: equal_gap_y
    ids: &a7
      - cell_3_0
      - cell_3_1
      - cell_3_2
    gap: 8
  - op: align_x
    ids: *a7
    edge: center
  - op: equal_gap_y
    ids: &a8
      - cell_4_0
      - cell_4_1
      - cell_4_2
    gap: 8
  - op: align_x
    ids: *a8
    edge: center
  - op: same_size
    ids:
      - bet_down
      - bet_up
  - op: align_y
    ids:
      - bet_down
      - bet_up
    edge: center
