screen: hud_minimap
base_resolution:
  - 1920
  - 1080
gui_scale: 3
elements:
  - id: shell
    kind: image
    anchor: top_right
    pos:
      - -16
      - 16
    size:
      - 184
      - 210
    props:
      texture: textures/ui/v2_minimap/panel
  - id: map
    kind: image
    parent: shell
    anchor: top_left
    pos:
      - 12
      - 12
    size:
      - 160
      - 160
    props:
      texture: textures/ui/v2_minimap/map
  - id: player_marker
    kind: image
    parent: shell
    anchor: top_left
    pos:
      - 86
      - 86
    size:
      - 12
      - 12
    props:
      texture: textures/ui/v2_minimap/marker_player
  - id: waypoint_a
    kind: image
    parent: shell
    anchor: top_left
    pos:
      - 42
      - 55
    size:
      - 12
      - 12
    props:
      texture: textures/ui/v2_minimap/marker_waypoint
  - id: waypoint_b
    kind: image
    parent: shell
    anchor: top_left
    pos:
      - 129
      - 122
    size:
      - 12
      - 12
    props:
      texture: textures/ui/v2_minimap/marker_waypoint
  - id: coordinates
    kind: label
    parent: shell
    anchor: top_left
    pos:
      - 12
      - 180
    size:
      - 160
      - 18
    props:
      text: X 128  Z -42
      localize: false
      font_size: normal
      font_scale_factor: 0.9
      text_alignment: center
constraints:
  - op: same_size
    ids:
      - player_marker
      - waypoint_a
      - waypoint_b
  - op: align_x
    ids:
      - map
      - coordinates
    edge: center
